[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
iroh = "1.0.3"
iroh-tickets = "1.0.0"
tokio = { version = "1.53.1", features = ["full"] }
postcard = { version = "1", features = ["use-std"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
rand = "0.8"
serde = "1.0.229"
log = "0.4.34"
